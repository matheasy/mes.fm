	<div class="tu" id="bm" data-lang="{{t:code}}">
{{LANGSW}}
		<div id="bm-notice" class="tu-card tu-card--tint" hidden style="margin-bottom:1em;"></div>

		<div class="tu-card" id="bm-setup">
			<p class="tu-note" style="margin:0;">{{t:mixUnits}}</p>
			<div class="tu-row" style="margin-top:1em;" id="bm-metric">
				<div class="tu-field tu-field--sm" style="flex-basis:11em;"><label for="bm-kg">{{t:weight}}</label><div class="tu-suffix"><input id="bm-kg" class="tu-input tu-input--big" type="text" inputmode="decimal" autocomplete="off" placeholder="{{t:phKg}}"><span>kg</span></div></div>
				<div class="tu-field tu-field--sm" style="flex-basis:11em;"><label for="bm-cm">{{t:height}}</label><div class="tu-suffix"><input id="bm-cm" class="tu-input tu-input--big" type="text" inputmode="decimal" autocomplete="off" placeholder="{{t:phCm}}"><span>cm</span></div></div>
			</div>
			<button type="button" class="bm-optbtn bm-imptoggle" id="bm-imptoggle" aria-controls="bm-imperial" hidden>{{t:impShow}}</button>
			<div class="tu-row" style="margin-top:1em;" id="bm-imperial">
				<div class="tu-field tu-field--sm" style="flex-basis:11em;"><label for="bm-lb">{{t:weight}}</label><div class="tu-suffix"><input id="bm-lb" class="tu-input tu-input--big" type="text" inputmode="decimal" autocomplete="off" placeholder="{{t:phLb}}"><span>lb</span></div></div>
				<div class="tu-field tu-field--sm" style="flex-basis:7em;"><label for="bm-ft">{{t:height}}</label><div class="tu-suffix"><input id="bm-ft" class="tu-input tu-input--big" type="text" inputmode="numeric" autocomplete="off" placeholder="{{t:phFt}}"><span>ft</span></div></div>
				<div class="tu-field tu-field--sm" style="flex-basis:7em;"><label for="bm-in">&nbsp;</label><div class="tu-suffix"><input id="bm-in" class="tu-input tu-input--big" type="text" inputmode="decimal" autocomplete="off" placeholder="{{t:phIn}}"><span>in</span></div></div>
			</div>
			<div class="bm-optbar"><span id="bm-optsum" class="bm-optsum" hidden></span><button type="button" id="bm-opttoggle" class="bm-optbtn" aria-controls="bm-opts" aria-expanded="true">{{t:hideOptions}}</button></div>
			<div class="bm-opts" id="bm-opts">
				<div class="bm-opt"><span class="tu-label" id="bm-units-label">{{t:showResultsIn}}</span>
					<div class="tu-seg" id="bm-units" role="group" aria-labelledby="bm-units-label">
						<button type="button" data-u="b" aria-pressed="true">{{t:both}}</button>
						<button type="button" data-u="m" aria-pressed="false">{{t:metric}}</button>
						<button type="button" data-u="i" aria-pressed="false">{{t:us}}</button>
					</div></div>
				<div class="bm-opt"><label for="bm-scale" class="tu-label">{{t:bmiScale}}</label>
					<select id="bm-scale" class="tu-select"><option value="who">{{t:scaleWho}}</option><option value="asia">{{t:scaleAsia}}</option></select></div>
				<p class="tu-note bm-scalehint" id="bm-scalehint">{{t:scaleHint}}</p>
			</div>
			<p class="tu-note" style="margin-bottom:0;">{{t:stepNote}}</p>
		</div>

		<div id="bm-empty" class="tu-card tu-card--tint" style="margin-top:1em;"><span>{{t:emptyPrompt}}</span><span class="tu-chips" id="bm-examples" style="display:inline-flex;margin:0;vertical-align:middle;"></span></div>

		<div id="bm-out" hidden>
			<div class="bm-top"><button type="button" class="tu-btn tu-btn--ghost" id="bm-link-top">&#128279; {{t:copyLink}}</button></div>
			<div class="tu-stats" id="bm-hero" aria-live="polite"></div>
			<div class="tu-card bm-verdict" id="bm-verdict" aria-live="polite"></div>
			<div class="tu-card" id="bm-gauge-card">
				<div class="tu-label">{{t:whereScale}}</div>
				<div class="bm-gauge" id="bm-gauge" aria-hidden="true"></div>
				<ul class="bm-cats" id="bm-cats"></ul>
			</div>
			<div class="bm-btns">
				<button type="button" class="tu-btn tu-btn--primary" id="bm-link">{{t:copyLink}}</button>
				<button type="button" class="tu-btn tu-btn--ghost" id="bm-save">{{t:saveMeasurement}}</button>
				<button type="button" class="tu-btn tu-btn--ghost bm-print">{{t:print}}</button>
			</div>
		</div>

		<div id="bm-hist-card" hidden>
			<h2>{{t:myMeasurements}}</h2>
			<div class="tu-card">
				<div class="tu-row" style="align-items:flex-end;" id="bm-addrow" hidden>
					<div class="tu-field tu-field--sm" style="flex-basis:10em;"><label for="bm-date">{{t:date}}</label><input id="bm-date" class="tu-input" type="date"></div>
					<div class="tu-field" style="flex:2 1 12em;"><label for="bm-note">{{t:noteOpt}}</label><input id="bm-note" class="tu-input" type="text" maxlength="60" autocomplete="off" placeholder="{{t:notePh}}"></div>
					<div class="tu-field tu-field--sm" style="flex:0 0 auto;"><button type="button" class="tu-btn tu-btn--primary" id="bm-add">{{t:save}}</button> <button type="button" class="tu-btn tu-btn--ghost" id="bm-addcancel">{{t:cancel}}</button></div>
				</div>
				<div id="bm-chart" class="bm-chart" role="img" aria-label="{{t:chartAria}}"></div>
				<div class="tu-table-wrap"><table class="tu-table" id="bm-table"></table></div>
				<div class="bm-btns">
					<button type="button" class="tu-btn tu-btn--ghost" id="bm-csv">{{t:copyCsv}}</button>
					<button type="button" class="tu-btn tu-btn--ghost" id="bm-link-all">{{t:copyLinkAll}}</button>
				</div>
				<p class="tu-note" id="bm-store-note" style="margin-bottom:0;"></p>
			</div>
		</div>

		<div class="tu-seo">
{{SEO}}
		</div>
	</div>
