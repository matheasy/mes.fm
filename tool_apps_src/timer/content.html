	<div class="tu" id="tm" data-views="{{VIEWS}}" data-customize="{{CUSTOMIZE}}">
		<div id="tm-ring" class="tm-ring" role="alertdialog" aria-live="assertive" hidden>
			<div class="tm-ring__msg" id="tm-ring-msg"></div>
			<div class="tm-ring__btns" id="tm-ring-btns"></div>
		</div>

		<div class="tm-addbar" id="tm-addbar" hidden></div>
		<div class="tm-secs" id="tm-secs"></div>
		<div class="tu-card tm-onmain" id="tm-onmain" hidden><label class="tm-check"><input type="checkbox" id="tm-onmain-box"> <span id="tm-onmain-txt"></span></label></div>

		<div class="tu-card tm-settings" id="tm-settings">
			<div class="tu-label">Sound and options</div>
			<div class="tu-row" style="align-items:flex-end;">
				<div class="tu-field" style="flex:1 1 13em;"><label for="tm-sound">When time is up</label>
					<select id="tm-sound" class="tu-select">
						<option value="friendly">Friendly (grandfather clock)</option>
						<option value="annoying">Annoying (alarm clock)</option>
						<option value="beep">Beeps</option>
						<option value="chime">Chime</option>
						<option value="off">Silent</option>
					</select></div>
				<div class="tu-field" style="flex:1 1 9em;"><label for="tm-repeat">Repeat</label>
					<select id="tm-repeat" class="tu-select"><option value="1">Once</option><option value="3">3 times</option><option value="0">Until I stop it</option></select></div>
				<div class="tu-field" style="flex:1 1 10em;"><label for="tm-vol">Volume</label><input id="tm-vol" type="range" min="0" max="100" step="5" style="width:100%;"></div>
				<div class="tu-field tu-field--sm" style="flex:0 0 auto;"><button type="button" class="tu-btn tu-btn--ghost" id="tm-test">▶ Test sound</button></div>
			</div>
			<div class="tm-checks">
				<label class="tm-check"><input type="checkbox" id="tm-opt-title"> Show the time in the browser tab (pick which with the tab icon on a timer)</label>
				<label class="tm-check"><input type="checkbox" id="tm-opt-awake"> Keep the screen awake while running</label>
				<label class="tm-check"><input type="checkbox" id="tm-opt-notify"> Pop-up notification when time is up</label>
				<label class="tm-check"><input type="checkbox" id="tm-opt-tenths"> Show tenths of a second</label>
			</div>
			<p class="tu-note" id="tm-store-note" style="margin-bottom:0;"></p>
		</div>

		<div class="tu-card tm-others">
			<div class="tu-label">More timers and clocks</div>
			<div class="tu-chips tm-others__l">
				<a class="tu-chip" href="/timer">All timers</a><a class="tu-chip" href="/countdown-timer">Countdown timer</a><a class="tu-chip" href="/stopwatch">Stopwatch</a><a class="tu-chip" href="/alarm-clock">Alarm clock</a>
				<a class="tu-chip" href="/pomodoro-timer">Pomodoro</a><a class="tu-chip" href="/interval-timer">Interval timer</a><a class="tu-chip" href="/countdown-to-date">Countdown to a date</a><a class="tu-chip" href="/clock">Clock</a><a class="tu-chip" href="/timezone">Time zones</a>
			</div>
		</div>

		<div class="tu-seo">
{{SEO}}
		</div>
	</div>
