<figure class="lu-wide"><a class="lu-ph" href="/luders-bands/img/rawdon-fig5-bar.jpg"><img src="/luders-bands/img/rawdon-fig5-bar.jpg" alt="A whole flat mild steel tensile bar covered in diagonal Lüders bands, with one diagonal strip still unmarked" loading="lazy" width="2000" height="326"></a>
<figcaption><b>A whole bar, almost fully banded.</b> Mild steel specimen after it was loaded far enough to strain nearly the entire gauge length: dark slanted bands everywhere, and one diagonal strip in the middle that the fronts have not reached yet (compare the simulator just before the fronts meet).<small>Photo: H. S. Rawdon, “Strain markings in mild steel under tension”, <i>Bureau of Standards Journal of Research</i> 1 (1928) 467, RP15, fig. 5a. U.S. Government work, public domain. <a href="https://archive.org/details/jresv1n3p467" target="_blank" rel="noopener">Original scan</a>.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/rawdon-fig3-wedges.jpg"><img src="/luders-bands/img/rawdon-fig3-wedges-sm.jpg" alt="Four photos of one end of a steel bar after four loadings, showing wedge-shaped strain markings growing from the fillet and spreading" loading="lazy" width="363" height="720"></a>
<figcaption><b>Bands growing from the shoulder.</b> One end of the same bar after each of four loadings (A to D, top to bottom, life size): the first wedge-shaped markings start at the fillet, where the stress is concentrated, then multiply and spread across the bar.<small>Rawdon 1928, fig. 3. Public domain.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/rawdon-fig9-macro.jpg"><img src="/luders-bands/img/rawdon-fig9-macro-sm.jpg" alt="Close-up of two wedge-shaped Lüders bands with branches at 45 degrees on low-carbon steel" loading="lazy" width="707" height="720"></a>
<figcaption><b>Close-up of the wedges</b> (×2). Line a appeared at 28,600 psi (197 MPa), line b at 30,200 psi (208 MPa); held under load, the wedges widened and side branches grew at about 45°. Inside the bands the surface is rippled, which is why yielded steel looks dull.<small>Rawdon 1928, fig. 9a. Public domain.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/rawdon-fig1-polish-scale.jpg"><img src="/luders-bands/img/rawdon-fig1-polish-scale-sm.jpg" alt="The same steel bar seen on a polished face with fine strain markings, and on the opposite face still covered in mill scale" loading="lazy" width="560" height="720"></a>
<figcaption><b>Polished face and mill-scale face</b> of the same bar. A: the polished side shows the bands as a change of sheen (the simulator's “Polished” look). B: the other side kept its mill scale, where only faint cracked lines show at this early stage.<small>Rawdon 1928, fig. 1. Public domain.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/qiu-2020-dic-band.jpg"><img src="/luders-bands/img/qiu-2020-dic-band-sm.jpg" alt="Six digital image correlation strain maps showing a Lüders band nucleating and growing at 55 degrees in hot-rolled steel" loading="lazy" width="354" height="720"></a>
<figcaption><b>A band being born, measured.</b> Digital image correlation strain maps of hot-rolled steel, steps 1 to 6: a band nucleates in the red circle and grows across the specimen at 55° to the pull (compare the simulator's “Strain map” look).<small>H. Qiu, T. Inoue, R. Ueji, <a href="https://doi.org/10.3390/met10040530" target="_blank" rel="noopener"><i>Metals</i> 10 (2020) 530</a>, fig. 5a. CC BY 4.0, cropped.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/cai-2016-almg-dic.jpg"><img src="/luders-bands/img/cai-2016-almg-dic-sm.jpg" alt="Strain maps of an aluminium-magnesium 5456 specimen: a Lüders band sweeping along it, then narrow Portevin-Le Chatelier bands" loading="lazy" width="659" height="720"></a>
<figcaption><b>Aluminium-magnesium 5456.</b> Top: the Lüders band sweeps the gauge in about 17 seconds. Bottom: much later, narrow Portevin-Le Chatelier bands keep appearing and jumping while the alloy hardens (the jerky flow behind stretcher strains on Al-Mg car panels).<small>Y.-L. Cai, S.-L. Yang, S.-H. Fu, Q.-C. Zhang, <a href="https://doi.org/10.3390/met6050120" target="_blank" rel="noopener"><i>Metals</i> 6 (2016) 120</a>, fig. 3b, c. CC BY 4.0, cropped.</small></figcaption></figure>
<figure><a class="lu-ph" href="/luders-bands/img/almatroushi-2025-curves.jpg"><img src="/luders-bands/img/almatroushi-2025-curves-sm.jpg" alt="Measured stress-strain curves of eight AISI 1524 steel specimens, each with a Lüders plateau near 275 MPa, some unloaded during the plateau" loading="lazy" width="720" height="596"></a>
<figcaption><b>Real curves with a plateau.</b> Eight AISI 1524 steel tests: an upper yield, a flat Lüders plateau near 275 MPa up to about 5%, then hardening. Several were unloaded and reloaded during the plateau (the vertical lines).<small>M. Almatroushi, S. Pervaiz, W. A. Samad, <a href="https://doi.org/10.3390/alloys4030019" target="_blank" rel="noopener"><i>Alloys</i> 4 (2025) 19</a>, fig. 5. CC BY 4.0.</small></figcaption></figure>
