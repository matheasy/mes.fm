<script>
/* autoads-header-gap-guard: relocates (never deletes) any Google Auto ads slot Google inserts
   between the logo header and the nav bar, moving it to below the entire
   header+nav+logo-badge complex (right before .outer-page-content) instead.
   Ads placed above the header, or anywhere below the nav, are left
   completely untouched. Google's own placeholder-collapse doesn't reliably
   fire once we've moved the node, so we also poll it: if no real ad iframe
   shows up within ~2s, we force the reserved space to 0 ourselves, so an
   unfilled slot never leaves a blank gap. */
(function () {
    function isBetweenHeaderAndNav(el) {
        var header = document.getElementById('header');
        var nav = document.querySelector('.info-bar-container');
        if (!header || !nav) return false;
        return !!(header.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) &&
               !!(nav.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING);
    }
    function relocate(node) {
        var target = document.querySelector('.outer-page-content');
        if (target) {
            target.before(node);
            return;
        }
        var nav = document.querySelector('.info-bar-container');
        if (nav) nav.after(node);
    }
    function collapseIfUnfilled(node) {
        var attempts = 0;
        var poll = setInterval(function () {
            attempts++;
            if (!node.isConnected) {
                clearInterval(poll);
                return;
            }
            if (node.querySelector('iframe')) {
                clearInterval(poll);
                return;
            }
            if (attempts >= 10) {
                node.style.setProperty('display', 'none', 'important');
                clearInterval(poll);
            }
        }, 200);
    }
    function handle(node) {
        if (node.nodeType !== 1) return;
        if (node.classList && node.classList.contains('google-auto-placed') && isBetweenHeaderAndNav(node)) {
            relocate(node);
            collapseIfUnfilled(node);
            return;
        }
        if (node.querySelectorAll) {
            node.querySelectorAll('.google-auto-placed').forEach(function (n) {
                if (isBetweenHeaderAndNav(n)) {
                    relocate(n);
                    collapseIfUnfilled(n);
                }
            });
        }
    }
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(handle);
        });
    }).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>

    <script>

    function calculateCustomWordSum() {
        var word = document.getElementById('wordInput').value.toLowerCase(); // Convert to lowercase
        var wordSum = 0; // Reset wordSum for each calculation

        var customValues = {
            'a': 1,
            'b': 2,
            'c': 3,
            'd': 4,
            'e': 5,
            'f': 6,
            'g': 7,
            'h': 8,
            'i': 9,
            'j': 10,
            'k': 11,
            'l': 12,
            'm': 13,
            'n': 14,
            'o': 15,
            'p': 16,
            'q': 17,
            'r': 18,
            's': 19,
            't': 20,
            'u': 21,
            'v': 22,
            'w': 23,
            'x': 24,
            'y': 25,
            'z': 26
            // Add more letters and their custom values as needed
        };

        for (var i = 0; i < word.length; i++) {
            var letter = word.charAt(i);

            // Check if the letter is in the customValues object, use the custom value, or default to 0
            var letterValue = customValues.hasOwnProperty(letter) ? customValues[letter] : 0;

            wordSum += letterValue;
        }

        var resultElement = document.getElementById('result');
        resultElement.innerHTML = wordSum;

        // Return the calculated wordSum
        return wordSum;
    }

    function updateGematriaResults() {
        var wordSum = calculateCustomWordSum();
        document.getElementById('resultSumerian').innerHTML = wordSum * 6;
    }

    // Call the function on page load to show the calculations for the default value "gematria"
    calculateCustomWordSum();
    </script>
</div>
