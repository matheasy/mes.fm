<body>

  <div class="top-bar">
    <a class="back-link" href="https://mes.fm/links">&larr; MES Links</a>
  </div>

  <header class="page-header">
    <h1 class="list-header" onclick="toggleAllLists()">Mathiew Personal Content <span id="arrowIconAll" class="arrow-icon">&#9660;</span></h1>
    <button id="themeToggle" class="theme-toggle-btn">Loading...</button>
  </header>

  <div class="content">
    <ul>
      <li class="list-container">
        <h2 class="sub-heading" onclick="toggleSubList('posts')">Posts <span id="arrowIcon-posts" class="arrow-icon" style="font-size: 75%;">&#9660;</span></h2>
        <ul id="posts">
          <li style="margin-left: 20px;"><a href="https://mes.fm/full-moon-hat">Full Moon Lookin' Like It Got a Hat On</a></li>
        </ul>
      </li>

      <li class="list-container">
        <h2 class="sub-heading" onclick="toggleSubList('videos')">Videos <span id="arrowIcon-videos" class="arrow-icon" style="font-size: 75%;">&#9660;</span></h2>
        <ul id="videos">
          <li style="margin-left: 20px;"><a href="https://mes.fm/lightning-sky">Lightning Lighting Up the Entire Sky</a></li>
        </ul>
      </li>
    </ul>
  </div>

  <script>
    function toggleAllLists() {
      const lists = document.querySelectorAll('.list-container ul');
      const arrowIconAll = document.getElementById('arrowIconAll');
      lists.forEach(list => list.classList.toggle('hidden'));
      arrowIconAll.textContent = lists.length && lists[0].classList.contains('hidden') ? '▲' : '▼';
    }

    function toggleSubList(listId) {
      const list = document.getElementById(listId);
      const arrowIcon = document.getElementById(`arrowIcon-${listId}`);
      list.classList.toggle('hidden');
      arrowIcon.textContent = list.classList.contains('hidden') ? '▼' : '▲';
    }
  </script>

  <script>
    // Dark/Light theme toggle – saved in browser (no POST, no resubmit popup)
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark');
        body.classList.remove('light');
        themeToggle.textContent = 'Switch to Light Mode';
        try { localStorage.setItem('theme', 'dark'); } catch (e) {}
      } else {
        body.classList.add('light');
        body.classList.remove('dark');
        themeToggle.textContent = 'Switch to Dark Mode';
        try { localStorage.setItem('theme', 'light'); } catch (e) {}
      }
    }

    let saved;
    try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
    if (saved === 'light') {
      setTheme(false);
    } else {
      setTheme(true);
    }

    themeToggle.addEventListener('click', () => {
      const isDarkNow = body.classList.contains('dark');
      setTheme(!isDarkNow);
    });
  </script>
