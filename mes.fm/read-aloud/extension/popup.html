<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MES Read Aloud</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><span class="brand">MES Read Aloud</span><a href="https://mes.fm/read-aloud" target="_blank" rel="noopener">mes.fm/read-aloud</a></header>
<section class="go">
  <button id="sel" class="big" disabled>Read selection</button>
  <button id="page" class="big pri">Read this page</button>
  <p class="small" id="msg"></p>
</section>
<section class="opts">
  <label>Setup <select id="profile"></select></label>
  <label>Voice <select id="voice"></select></label>
  <label>Speed <input type="range" id="rate" min="0.5" max="3" step="0.05"> <output id="rateout">1.0&times;</output></label>
  <label class="chk"><input type="checkbox" id="siteprof"> Always use this setup on <b class="hn">this site</b></label>
</section>
<footer><a href="options.html" target="_blank">All settings</a> <span class="small">Shortcut: Alt+Shift+R</span></footer>
<script src="srlib.js"></script>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
