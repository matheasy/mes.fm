
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MES Stats - Most viewed pages across mes.fm and its calculator subdomains, updated live.">
  <meta name="keywords" content="MES, Math Easy Solutions, Stats, Analytics, Page Views">
  <meta name="author" content="Mathiew Estepho">
  <link rel="icon" href="https://mes.fm/img/favicon.ico?v=1.0" type="image/x-icon" />
  <title>MES Stats</title>
  <style>
    h1 {
      text-align: center;
      font-size: 3.2em;
    }

    .page-header {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .page-header .theme-toggle-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .hidden {
      display: none;
    }

    .top-bar {
      max-width: 900px;
      margin: 0 auto;
    }

    body {
      font-weight: 550;
      word-wrap: break-word;
      transition: background-color 0.3s, color 0.3s;
      padding: 0 1.5em 3em;
    }

    body.light {
      background-color: #ffffff;
      color: #000000;
    }

    body.light a {
      color: #0000ff;
    }

    body.dark {
      background-color: #1a1a1a;
      color: #ffffff;
    }

    body.dark a {
      color: #4da8ff;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
    }

    .updated-at {
      text-align: center;
      font-size: 0.85em;
      opacity: 0.7;
      margin-bottom: 2em;
    }

    .stats-section {
      margin-bottom: 2.5em;
    }

    .stats-section h2 {
      font-size: 1.3em;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 0.5em 0.75em;
      border-bottom: 1px solid rgba(128, 128, 128, 0.3);
    }

    th {
      font-size: 0.85em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    td.views, th.views {
      text-align: right;
      white-space: nowrap;
    }

    td.site {
      white-space: nowrap;
      opacity: 0.75;
      font-size: 0.9em;
    }

    .empty-state {
      text-align: center;
      opacity: 0.7;
      padding: 1em 0;
    }

    @media screen and (max-width: 600px) {
      h1 {
        font-size: 2.4em;
      }
      .page-header {
        flex-direction: column;
      }
      .page-header .theme-toggle-btn {
        position: static;
        transform: none;
        margin-top: 0;
      }
      table {
        table-layout: fixed;
      }
      th, td {
        padding: 0.4em 0.4em;
        font-size: 0.8em;
        overflow-wrap: anywhere;
      }
      td.site {
        white-space: normal;
      }
      th.views, td.views {
        width: 3.5em;
      }
    }

    .theme-toggle-btn {
      margin: 10px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
    }

    body.light .theme-toggle-btn {
      background-color: #dddddd;
      color: #000000;
    }

    body.dark .theme-toggle-btn {
      background-color: #555555;
      color: #ffffff;
    }

    .back-link {
      display: inline-block;
      margin: 0.5em 0 0;
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461238060884369" crossorigin="anonymous"></script>
<script>
/* auto-ads-inpage-suppress: same guard as mes.fm/links -- this page carries two deliberate
   manual ad units (top and bottom) instead of Google's Auto ads in-page placements, so any
   Auto-ads-inserted in-page/native block is hidden the instant it appears. */
(function () {
    function hide(node) {
        node.style.setProperty('display', 'none', 'important');
    }
    function isAutoAdNode(node) {
        return node.classList && (node.classList.contains('google-auto-placed') || node.classList.contains('google-anno-sc'));
    }
    function handle(node) {
        if (node.nodeType !== 1) return;
        if (isAutoAdNode(node)) {
            hide(node);
            return;
        }
        if (node.querySelectorAll) {
            node.querySelectorAll('.google-auto-placed, .google-anno-sc').forEach(hide);
        }
    }
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(handle);
        });
    }).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>
</head>
<body>
<div class="ad-slot" style="text-align: center;">
  <!-- MES Links Square -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-1461238060884369"
       data-ad-slot="1197859571"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
</div>

  <div class="top-bar">
    <a class="back-link" href="https://mes.fm">&larr; MES</a>
  </div>

  <header class="page-header">
    <h1>MES Stats</h1>
    <button id="themeToggle" class="theme-toggle-btn">Loading...</button>
  </header>

  <p class="updated-at" id="updatedAt">Loading stats&hellip;</p>

  <div class="content">
    <section class="stats-section">
      <h2>Most Viewed Pages</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Page</th><th class="site">Site</th><th class="views">Views</th></tr>
          </thead>
          <tbody id="topPagesBody">
            <tr><td colspan="3" class="empty-state">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="stats-section">
      <h2>Views by Site</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Site</th><th class="views">Views</th></tr>
          </thead>
          <tbody id="siteTotalsBody">
            <tr><td colspan="2" class="empty-state">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // Dark/Light theme toggle – saved in browser (no POST, no resubmit popup)
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark');
        body.classList.remove('light');
        themeToggle.textContent = 'Switch to Light Mode';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.add('light');
        body.classList.remove('dark');
        themeToggle.textContent = 'Switch to Dark Mode';
        localStorage.setItem('theme', 'light');
      }
    }

    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
      setTheme(false);
    } else {
      setTheme(true);
    }

    themeToggle.addEventListener('click', () => {
      const isDarkNow = body.classList.contains('dark');
      setTheme(!isDarkNow);
    });
  </script>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();

        const topPagesBody = document.getElementById('topPagesBody');
        if (data.topPages && data.topPages.length) {
          topPagesBody.innerHTML = data.topPages.map(function (p) {
            return '<tr><td>' + escapeHtml(p.path) + '</td><td class="site">' + escapeHtml(p.site) + '</td><td class="views">' + p.views.toLocaleString() + '</td></tr>';
          }).join('');
        } else {
          topPagesBody.innerHTML = '<tr><td colspan="3" class="empty-state">No data yet.</td></tr>';
        }

        const siteTotalsBody = document.getElementById('siteTotalsBody');
        if (data.siteTotals && data.siteTotals.length) {
          siteTotalsBody.innerHTML = data.siteTotals.map(function (s) {
            return '<tr><td>' + escapeHtml(s.site) + '</td><td class="views">' + s.views.toLocaleString() + '</td></tr>';
          }).join('');
        } else {
          siteTotalsBody.innerHTML = '<tr><td colspan="2" class="empty-state">No data yet.</td></tr>';
        }

        document.getElementById('updatedAt').textContent = 'Last updated: ' + new Date(data.updatedAt).toLocaleString();
      } catch (e) {
        document.getElementById('updatedAt').textContent = 'Stats are temporarily unavailable.';
      }
    }

    loadStats();
  </script>

  <div style="clear: both;"></div>

  <div class="ad-slot" style="text-align: center;">
    <!-- MES Links Square -->
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-1461238060884369"
         data-ad-slot="1197859571"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <footer style="text-align: center;">
    <p>&copy; 2026 Math Easy Solutions (MES). All rights reserved. | <a href="https://mes.fm/contact">Contact Us</a> | <a href="https://mes.fm/privacy-policy">Privacy Policy</a></p>
  </footer>

  <script>
    // ad-slot-fill-and-collapse: same approach as mes.fm/links -- request a fill for each manual
    // ad unit, then hide it completely if nothing filled within the poll window.
    (function () {
      document.querySelectorAll('.ad-slot ins.adsbygoogle').forEach(function () {
        (adsbygoogle = window.adsbygoogle || []).push({});
      });
      document.querySelectorAll('.ad-slot').forEach(function (slot) {
        var attempts = 0;
        var poll = setInterval(function () {
          attempts++;
          if (slot.querySelector('iframe')) {
            clearInterval(poll);
            return;
          }
          if (attempts >= 10) {
            slot.style.setProperty('display', 'none', 'important');
            clearInterval(poll);
          }
        }, 200);
      });
    })();
  </script>
<script src="/main_js/track.js" defer></script></body>
</html>
