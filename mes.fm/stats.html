
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MES Stats - Most viewed pages across mes.fm and its calculator subdomains, updated live.">
  <meta name="keywords" content="MES, Math Easy Solutions, Stats, Analytics, Page Views">
  <meta name="author" content="Mathiew Estepho">
  <link rel="icon" href="https://mes.fm/img/favicon.ico?v=1.0" type="image/x-icon" />
  <meta name="color-scheme" content="light dark">
  <title>MES Stats</title>
  <style>
    h1 {
      text-align: center;
      font-size: 3.2em;
    }

    .page-header {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .page-header .theme-toggle-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .hidden {
      display: none;
    }

    .top-bar {
      max-width: 900px;
      margin: 0 auto;
    }

    body {
      font-weight: 550;
      word-wrap: break-word;
      transition: background-color 0.3s, color 0.3s;
      padding: 0 1.5em 3em;
    }

    body.light {
      color-scheme: light;
      background-color: #ffffff;
      color: #000000;
    }

    body.light a {
      color: #0000ff;
    }

    body.dark {
      color-scheme: dark;
      background-color: #1a1a1a;
      color: #ffffff;
    }

    body.dark a {
      color: #4da8ff;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
    }

    .updated-at {
      text-align: center;
      font-size: 0.85em;
      opacity: 0.7;
      margin-bottom: 2em;
    }

    .range-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.5em;
      margin: 1em 0;
    }

    .range-tab {
      padding: 0.4em 0.9em;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-size: 0.85em;
    }

    body.light .range-tab {
      color: #000000;
    }

    body.dark .range-tab {
      color: #ffffff;
    }

    .range-tab.active {
      font-weight: bold;
    }

    body.light .range-tab.active {
      background-color: #dddddd;
    }

    body.dark .range-tab.active {
      background-color: #555555;
    }

    .stats-section {
      margin-bottom: 2.5em;
    }

    .stats-section h2 {
      font-size: 1.3em;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 0.5em 0.75em;
      border-bottom: 1px solid rgba(128, 128, 128, 0.3);
    }

    th {
      font-size: 0.85em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    td.views, th.views {
      text-align: right;
      white-space: nowrap;
    }

    td.site {
      white-space: nowrap;
      opacity: 0.75;
      font-size: 0.9em;
    }

    .empty-state {
      text-align: center;
      opacity: 0.7;
      padding: 1em 0;
    }

    tfoot td {
      font-weight: bold;
      border-bottom: none;
      border-top: 2px solid rgba(128, 128, 128, 0.4);
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th.sortable:hover,
    th.active-sort {
      opacity: 1;
    }

    .show-more-btn {
      display: block;
      margin: 0.8em auto 0;
      padding: 0.4em 0.9em;
      border: 1px solid rgba(128, 128, 128, 0.4);
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      font-size: 0.85em;
    }

    body.light .show-more-btn { color: #000000; }
    body.dark .show-more-btn { color: #ffffff; }

    @media screen and (max-width: 600px) {
      h1 {
        font-size: 2.4em;
      }
      .page-header {
        flex-direction: column;
      }
      .page-header .theme-toggle-btn {
        position: static;
        transform: none;
        margin-top: 0;
      }
      table:not(.wide-table) {
        table-layout: fixed;
      }
      /* Wide tables (device breakdown columns) can't be squeezed to fit the
         viewport without wrapping every cell to one character per line --
         let them size to their content and scroll horizontally in
         .table-wrap instead, same as any other overflow-prone content. */
      .wide-table {
        width: auto;
        min-width: 100%;
      }
      .wide-table td.site,
      .wide-table td:first-child {
        white-space: nowrap;
      }
      th, td {
        padding: 0.4em 0.4em;
        font-size: 0.8em;
        overflow-wrap: anywhere;
      }
      td.site {
        white-space: normal;
      }
      th.views, td.views {
        width: 3.5em;
      }
    }

    .theme-toggle-btn {
      margin: 10px;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
    }

    body.light .theme-toggle-btn {
      background-color: #dddddd;
      color: #000000;
    }

    body.dark .theme-toggle-btn {
      background-color: #555555;
      color: #ffffff;
    }

    .back-link {
      display: inline-block;
      margin: 0.5em 0 0;
    }
  /* RESPONSIVE-FIX-INSERTED */
@media (max-width: 768px) {
  .outer-container { width: 100% !important; margin: 0 !important; }
  .outer-page-content { width: 100% !important; display: block !important; }
  .side-bar { width: 100% !important; float: none !important; }
  .page-box { width: auto !important; display: block !important; margin: 0 auto 0.5em auto !important; }
  img { max-width: 100% !important; height: auto !important; }
  table { max-width: 100% !important; }
}
</style>
  <!-- ADSENSE-DEFERRED: load adsbygoogle.js (auto ads + consent) on the first
     scroll / pointer / key interaction, or after 6s, so its ad + consent JS
     stops blocking the main thread during initial load. -->
    <script>
    (function () {
      var EVT = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
      var done = false;
      function go() {
        if (done) return;
        done = true;
        EVT.forEach(function (e) { removeEventListener(e, go); });
        var s = document.createElement('script');
        s.async = true;
        s.crossOrigin = 'anonymous';
        s.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1461238060884369';
        document.head.appendChild(s);
      }
      EVT.forEach(function (e) { addEventListener(e, go, { passive: true }); });
      setTimeout(go, 6000);
    })();
    </script>
<script>
/* autoads-header-gap-guard: guards two gaps against Google Auto ads (in-page ad blocks,
   class `google-auto-placed`), plus a third: Google's separate "annotation"
   text-ad format (chips styled like `<div class="google-anno-skip
   google-anno-sc" aria-label="...">`, a different Auto ads mechanism than
   the in-page blocks above -- rendered as small pill/badge buttons made to
   look like real nav links). 1) Logo header <-> nav bar: on desktop, any
   in-page ad caught here is relocated to just below the whole
   header+nav+logo-badge complex (before .outer-page-content) and allowed to
   show if it fills; on mobile (max-width: 768px, this repo's existing
   responsive breakpoint) it is hidden outright instead -- no ad shows below
   the nav bar on mobile at all. 2) Comments toggle (#comments-button) <->
   comments widget (#comments-box): on every device, any in-page ad caught
   here is relocated to just after the comments box and allowed to show if
   it fills. 3) Annotation chips (`.google-anno-sc`) anywhere inside #header,
   #footer, or .side-bar: hidden outright on every device. Unlike the in-page
   ad blocks, Google serves many of these annotation chips per page load, so
   removing the ones in these three zones doesn't cost the page its one
   shot at an ad the way deleting the in-page block did -- no relocate/poll
   needed, just hide on sight.
   In the first two cases Google's own placeholder-collapse doesn't reliably
   fire once we've moved the node, so we poll it: if no real ad iframe shows
   up within ~2s, we force the reserved space to 0 ourselves, so an unfilled
   slot never leaves a blank gap. */
(function () {
    function isMobile() {
        return window.matchMedia('(max-width: 768px)').matches;
    }
    function isBetween(before, after, el) {
        if (!before || !after) return false;
        return !!(before.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) &&
               !!(after.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING);
    }
    function collapseIfUnfilled(node) {
        var attempts = 0;
        var poll = setInterval(function () {
            attempts++;
            if (!node.isConnected) {
                clearInterval(poll);
                return;
            }
            if (node.querySelector('iframe')) {
                clearInterval(poll);
                return;
            }
            if (attempts >= 10) {
                node.style.setProperty('display', 'none', 'important');
                clearInterval(poll);
            }
        }, 200);
    }
    function handleHeaderNavZone(node) {
        var header = document.getElementById('header');
        var nav = document.querySelector('.info-bar-container');
        if (!isBetween(header, nav, node)) return false;
        if (isMobile()) {
            node.style.setProperty('display', 'none', 'important');
            return true;
        }
        var target = document.querySelector('.outer-page-content');
        if (target) {
            target.before(node);
        } else if (nav) {
            nav.after(node);
        }
        collapseIfUnfilled(node);
        return true;
    }
    function handleCommentsZone(node) {
        var button = document.getElementById('comments-button');
        var box = document.getElementById('comments-box');
        if (!isBetween(button, box, node)) return false;
        box.after(node);
        collapseIfUnfilled(node);
        return true;
    }
    function inAnnotationGuardedZone(el) {
        return !!(el.closest('#header') || el.closest('#footer') || el.closest('.side-bar'));
    }
    function handleAnnotationChip(node) {
        if (node.classList && node.classList.contains('google-anno-sc') && inAnnotationGuardedZone(node)) {
            node.style.setProperty('display', 'none', 'important');
            return true;
        }
        return false;
    }
    function handle(node) {
        if (node.nodeType !== 1) return;
        if (node.classList && node.classList.contains('google-auto-placed')) {
            if (handleHeaderNavZone(node)) return;
            handleCommentsZone(node);
            return;
        }
        if (handleAnnotationChip(node)) return;
        if (node.querySelectorAll) {
            node.querySelectorAll('.google-auto-placed').forEach(function (n) {
                if (handleHeaderNavZone(n)) return;
                handleCommentsZone(n);
            });
            node.querySelectorAll('.google-anno-sc').forEach(function (n) {
                handleAnnotationChip(n);
            });
        }
    }
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(handle);
        });
    }).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>

<body>

  <div class="top-bar">
    <a class="back-link" href="https://mes.fm">&larr; MES</a> | <a class="back-link" href="https://mes.fm/links">MES Links</a>
  </div>

  <header class="page-header">
    <h1>MES Stats</h1>
    <button id="themeToggle" class="theme-toggle-btn">Loading...</button>
  </header>

  <div class="range-tabs" id="rangeTabs">
    <button class="range-tab" data-range="24h">24 Hours</button>
    <button class="range-tab" data-range="7d">7 Days</button>
    <button class="range-tab" data-range="30d">30 Days</button>
    <button class="range-tab" data-range="365d">365 Days</button>
    <button class="range-tab" data-range="all">All Time</button>
  </div>

  <p class="updated-at" id="updatedAt">Loading stats&hellip;</p>

  <div class="content">
    <section class="stats-section">
      <h2>Most Viewed Pages</h2>
      <div class="table-wrap">
        <table class="wide-table">
          <thead id="topPagesHead">
            <tr><th>Page</th><th class="site">Site</th><th class="views">Views</th></tr>
          </thead>
          <tbody id="topPagesBody">
            <tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
      <button id="showMorePages" class="show-more-btn" style="display: none;"></button>
    </section>

    <section class="stats-section">
      <h2>Views by Site</h2>
      <div class="table-wrap">
        <table class="wide-table">
          <thead id="siteTotalsHead">
            <tr><th>Site</th><th class="views">Views</th></tr>
          </thead>
          <tbody id="siteTotalsBody">
            <tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>
          </tbody>
          <tfoot id="siteTotalsFoot"></tfoot>
        </table>
      </div>
    </section>

    <section class="stats-section">
      <h2>Views by Device</h2>
      <div class="table-wrap">
        <table>
          <thead id="deviceTotalsHead">
            <tr><th>Device</th><th class="views">Views</th></tr>
          </thead>
          <tbody id="deviceTotalsBody">
            <tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>
          </tbody>
          <tfoot id="deviceTotalsFoot"></tfoot>
        </table>
      </div>
    </section>
  </div>

  <script>
    // Dark/Light theme toggle – saved in browser (no POST, no resubmit popup)
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark');
        body.classList.remove('light');
        themeToggle.textContent = 'Switch to Light Mode';
        try { localStorage.setItem('theme', 'dark'); } catch (e) {}
      } else {
        body.classList.add('light');
        body.classList.remove('dark');
        themeToggle.textContent = 'Switch to Dark Mode';
        try { localStorage.setItem('theme', 'light'); } catch (e) {}
      }
    }

    let saved;
    try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
    if (saved === 'light') {
      setTheme(false);
    } else {
      setTheme(true);
    }

    themeToggle.addEventListener('click', () => {
      const isDarkNow = body.classList.contains('dark');
      setTheme(!isDarkNow);
    });
  </script>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const RANGE_LABELS = { '24h': '24 hours', '7d': '7 days', '30d': '30 days', '365d': '365 days', all: 'all time' };
    const DEVICE_LABELS = { desktop: 'Desktop', mobile: 'Mobile', tablet: 'Tablet', tv: 'TV', bot: 'Bot', unknown: 'Unknown' };
    const DEFAULT_DEVICES = Object.keys(DEVICE_LABELS);
    let savedRange;
    try { savedRange = localStorage.getItem('statsRange'); } catch (e) { savedRange = null; }
    let currentRange = savedRange || '7d';
    if (!(currentRange in RANGE_LABELS)) currentRange = '7d';

    // The API already returns up to 50 rows in one (server-cached) call, so
    // expanding/collapsing the list below is pure client-side rendering --
    // no extra request or API cost per click.
    const PAGES_PREVIEW_COUNT = 10;
    let topPagesData = [];
    let topPagesDevices = [];
    let siteTotalsData = [];
    let siteTotalsDevices = [];
    let deviceTotalsData = [];
    let showAllPages = false;
    const showMoreBtn = document.getElementById('showMorePages');

    // Per-table sort state. Text columns (page path, site domain, device
    // name) default to A-Z; numeric columns (views, and each device's view
    // count) default to most-first. Clicking the already-active column just
    // flips its direction instead of picking a new default.
    let pagesSort = { key: 'views', dir: 'desc' };
    let siteSort = { key: 'views', dir: 'desc' };
    let deviceSort = { key: 'views', dir: 'desc' };

    function isTextSortKey(key) {
      return key === 'site' || key === 'path' || key === 'device';
    }

    function toggleSort(state, key) {
      if (state.key === key) {
        state.dir = state.dir === 'desc' ? 'asc' : 'desc';
      } else {
        state.key = key;
        state.dir = isTextSortKey(key) ? 'asc' : 'desc';
      }
    }

    function compareRows(a, b, key) {
      if (key === 'views') return a.views - b.views;
      if (key === 'site') return (a.site || '').localeCompare(b.site || '');
      if (key === 'path') return (a.path || '').localeCompare(b.path || '');
      if (key === 'device') return (DEVICE_LABELS[a.device] || a.device || '').localeCompare(DEVICE_LABELS[b.device] || b.device || '');
      // Anything else is a per-device view-count column.
      return ((a.deviceViews && a.deviceViews[key]) || 0) - ((b.deviceViews && b.deviceViews[key]) || 0);
    }

    function sortRows(rows, state) {
      const sign = state.dir === 'desc' ? -1 : 1;
      return rows.slice().sort(function (a, b) { return sign * compareRows(a, b, state.key); });
    }

    function sortArrow(state, key) {
      if (state.key !== key) return '';
      return state.dir === 'desc' ? ' ▼' : ' ▲';
    }

    function thCell(label, key, state, extraClass) {
      const classes = ['sortable'];
      if (extraClass) classes.push(extraClass);
      const isActive = state.key === key;
      if (isActive) classes.push('active-sort');
      const ariaSort = isActive ? (state.dir === 'desc' ? 'descending' : 'ascending') : 'none';
      return '<th class="' + classes.join(' ') + '" data-sort-key="' + key + '" aria-sort="' + ariaSort + '">' +
        escapeHtml(label) + sortArrow(state, key) + '</th>';
    }

    function setActiveTab() {
      document.querySelectorAll('.range-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.range === currentRange);
      });
    }

    // Only show a device column if at least one displayed row actually has
    // views from it -- keeps the table from filling up with all-zero TV/Bot
    // columns before that kind of traffic has shown up.
    function visibleDevices(rows, devices) {
      return (devices || DEFAULT_DEVICES).filter(function (d) {
        return rows.some(function (r) { return r.deviceViews && r.deviceViews[d] > 0; });
      });
    }

    function deviceCell(row, device) {
      const v = (row.deviceViews && row.deviceViews[device]) || 0;
      return '<td class="views">' + v.toLocaleString() + '</td>';
    }

    function renderTopPages() {
      const topPagesHead = document.getElementById('topPagesHead');
      const topPagesBody = document.getElementById('topPagesBody');
      if (!topPagesData.length) {
        topPagesHead.innerHTML = '<tr>' + thCell('Page', 'path', pagesSort) + thCell('Site', 'site', pagesSort, 'site') + thCell('Views', 'views', pagesSort, 'views') + '</tr>';
        topPagesBody.innerHTML = '<tr><td colspan="99" class="empty-state">No data for the past ' + RANGE_LABELS[currentRange] + '.</td></tr>';
        showMoreBtn.style.display = 'none';
        return;
      }

      const devices = topPagesDevices;
      const sorted = sortRows(topPagesData, pagesSort);
      const visible = showAllPages ? sorted : sorted.slice(0, PAGES_PREVIEW_COUNT);

      topPagesHead.innerHTML = '<tr>' + thCell('Page', 'path', pagesSort) + thCell('Site', 'site', pagesSort, 'site') +
        devices.map(function (d) { return thCell(DEVICE_LABELS[d] || d, d, pagesSort, 'views'); }).join('') +
        thCell('Views', 'views', pagesSort, 'views') + '</tr>';

      topPagesBody.innerHTML = visible.map(function (p) {
        const url = 'https://' + p.site + p.path;
        return '<tr><td><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(p.path) + '</a></td>' +
          '<td class="site"><a href="https://' + escapeHtml(p.site) + '" target="_blank" rel="noopener">' + escapeHtml(p.site) + '</a></td>' +
          devices.map(function (d) { return deviceCell(p, d); }).join('') +
          '<td class="views">' + p.views.toLocaleString() + '</td></tr>';
      }).join('');

      if (topPagesData.length > PAGES_PREVIEW_COUNT) {
        showMoreBtn.style.display = 'block';
        showMoreBtn.textContent = showAllPages ? 'Show top ' + PAGES_PREVIEW_COUNT : 'Show all (' + topPagesData.length + ')';
      } else {
        showMoreBtn.style.display = 'none';
      }
    }

    function renderSiteTotals() {
      const siteTotalsHead = document.getElementById('siteTotalsHead');
      const siteTotalsBody = document.getElementById('siteTotalsBody');
      const siteTotalsFoot = document.getElementById('siteTotalsFoot');
      if (!siteTotalsData.length) {
        siteTotalsHead.innerHTML = '<tr>' + thCell('Site', 'site', siteSort) + thCell('Views', 'views', siteSort, 'views') + '</tr>';
        siteTotalsBody.innerHTML = '<tr><td colspan="99" class="empty-state">No data for the past ' + RANGE_LABELS[currentRange] + '.</td></tr>';
        siteTotalsFoot.innerHTML = '';
        return;
      }

      const devices = siteTotalsDevices;
      const sorted = sortRows(siteTotalsData, siteSort);

      siteTotalsHead.innerHTML = '<tr>' + thCell('Site', 'site', siteSort) +
        devices.map(function (d) { return thCell(DEVICE_LABELS[d] || d, d, siteSort, 'views'); }).join('') +
        thCell('Views', 'views', siteSort, 'views') + '</tr>';

      siteTotalsBody.innerHTML = sorted.map(function (s) {
        return '<tr><td><a href="https://' + escapeHtml(s.site) + '" target="_blank" rel="noopener">' + escapeHtml(s.site) + '</a></td>' +
          devices.map(function (d) { return deviceCell(s, d); }).join('') +
          '<td class="views">' + s.views.toLocaleString() + '</td></tr>';
      }).join('');

      const totalViews = siteTotalsData.reduce(function (sum, s) { return sum + s.views; }, 0);
      const deviceColumnTotals = devices.map(function (d) {
        const sum = siteTotalsData.reduce(function (acc, s) { return acc + ((s.deviceViews && s.deviceViews[d]) || 0); }, 0);
        return '<td class="views">' + sum.toLocaleString() + '</td>';
      }).join('');
      siteTotalsFoot.innerHTML = '<tr><td>Total</td>' + deviceColumnTotals + '<td class="views">' + totalViews.toLocaleString() + '</td></tr>';
    }

    function renderDeviceTotals() {
      const deviceTotalsHead = document.getElementById('deviceTotalsHead');
      const deviceTotalsBody = document.getElementById('deviceTotalsBody');
      const deviceTotalsFoot = document.getElementById('deviceTotalsFoot');
      if (!deviceTotalsData.length) {
        deviceTotalsHead.innerHTML = '<tr>' + thCell('Device', 'device', deviceSort) + thCell('Views', 'views', deviceSort, 'views') + '</tr>';
        deviceTotalsBody.innerHTML = '<tr><td colspan="99" class="empty-state">No data for the past ' + RANGE_LABELS[currentRange] + '.</td></tr>';
        deviceTotalsFoot.innerHTML = '';
        return;
      }

      const sorted = sortRows(deviceTotalsData, deviceSort);

      deviceTotalsHead.innerHTML = '<tr>' + thCell('Device', 'device', deviceSort) + thCell('Views', 'views', deviceSort, 'views') + '</tr>';

      deviceTotalsBody.innerHTML = sorted.map(function (d) {
        const label = DEVICE_LABELS[d.device] || escapeHtml(d.device);
        return '<tr><td>' + label + '</td><td class="views">' + d.views.toLocaleString() + '</td></tr>';
      }).join('');

      const totalDeviceViews = deviceTotalsData.reduce(function (sum, d) { return sum + d.views; }, 0);
      deviceTotalsFoot.innerHTML = '<tr><td>Total</td><td class="views">' + totalDeviceViews.toLocaleString() + '</td></tr>';
    }

    showMoreBtn.addEventListener('click', function () {
      showAllPages = !showAllPages;
      renderTopPages();
    });

    document.getElementById('topPagesHead').addEventListener('click', function (e) {
      const th = e.target.closest('th[data-sort-key]');
      if (!th) return;
      toggleSort(pagesSort, th.dataset.sortKey);
      renderTopPages();
    });

    document.getElementById('siteTotalsHead').addEventListener('click', function (e) {
      const th = e.target.closest('th[data-sort-key]');
      if (!th) return;
      toggleSort(siteSort, th.dataset.sortKey);
      renderSiteTotals();
    });

    document.getElementById('deviceTotalsHead').addEventListener('click', function (e) {
      const th = e.target.closest('th[data-sort-key]');
      if (!th) return;
      toggleSort(deviceSort, th.dataset.sortKey);
      renderDeviceTotals();
    });

    async function loadStats() {
      setActiveTab();
      document.getElementById('topPagesBody').innerHTML = '<tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>';
      showMoreBtn.style.display = 'none';
      document.getElementById('siteTotalsBody').innerHTML = '<tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>';
      document.getElementById('siteTotalsFoot').innerHTML = '';
      document.getElementById('deviceTotalsBody').innerHTML = '<tr><td colspan="99" class="empty-state">Loading&hellip;</td></tr>';
      document.getElementById('deviceTotalsFoot').innerHTML = '';
      document.getElementById('updatedAt').textContent = 'Loading stats…';

      try {
        const res = await fetch('/api/stats?range=' + encodeURIComponent(currentRange));
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();
        const devices = data.devices && data.devices.length ? data.devices : DEFAULT_DEVICES;

        topPagesData = data.topPages || [];
        topPagesDevices = visibleDevices(topPagesData, devices);
        showAllPages = false;
        renderTopPages();

        siteTotalsData = data.siteTotals || [];
        siteTotalsDevices = visibleDevices(siteTotalsData, devices);
        renderSiteTotals();

        deviceTotalsData = data.deviceTotals || [];
        renderDeviceTotals();

        document.getElementById('updatedAt').textContent = 'Last updated: ' + new Date(data.updatedAt).toLocaleString();
      } catch (e) {
        document.getElementById('updatedAt').textContent = 'Stats are temporarily unavailable.';
      }
    }

    document.getElementById('rangeTabs').addEventListener('click', function (e) {
      const btn = e.target.closest('.range-tab');
      if (!btn || btn.dataset.range === currentRange) return;
      currentRange = btn.dataset.range;
      try { localStorage.setItem('statsRange', currentRange); } catch (e) {}
      loadStats();
    });

    loadStats();
  </script>
