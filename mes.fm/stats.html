<script>
/* auto-ads-inpage-suppress: same guard as mes.fm/links -- this page carries two deliberate
   manual ad units (top and bottom) instead of Google's Auto ads in-page placements, so any
   Auto-ads-inserted in-page/native block is hidden the instant it appears. */
(function () {
    function hide(node) {
        node.style.setProperty('display', 'none', 'important');
    }
    function isAutoAdNode(node) {
        return node.classList && (node.classList.contains('google-auto-placed') || node.classList.contains('google-anno-sc'));
    }
    function handle(node) {
        if (node.nodeType !== 1) return;
        if (isAutoAdNode(node)) {
            hide(node);
            return;
        }
        if (node.querySelectorAll) {
            node.querySelectorAll('.google-auto-placed, .google-anno-sc').forEach(hide);
        }
    }
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(handle);
        });
    }).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>
<script>
/* autoads-header-gap-guard: guards two gaps against Google Auto ads (in-page ad blocks,
   class `google-auto-placed`), plus a third: Google's separate "annotation"
   text-ad format (chips styled like `<div class="google-anno-skip
   google-anno-sc" aria-label="...">`, a different Auto ads mechanism than
   the in-page blocks above -- rendered as small pill/badge buttons made to
   look like real nav links). 1) Logo header <-> nav bar: on desktop, any
   in-page ad caught here is relocated to just below the whole
   header+nav+logo-badge complex (before .outer-page-content) and allowed to
   show if it fills; on mobile (max-width: 768px, this repo's existing
   responsive breakpoint) it is hidden outright instead -- no ad shows below
   the nav bar on mobile at all. 2) Comments toggle (#comments-button) <->
   comments widget (#comments-box): on every device, any in-page ad caught
   here is relocated to just after the comments box and allowed to show if
   it fills. 3) Annotation chips (`.google-anno-sc`) anywhere inside #header,
   #footer, or .side-bar: hidden outright on every device. Unlike the in-page
   ad blocks, Google serves many of these annotation chips per page load, so
   removing the ones in these three zones doesn't cost the page its one
   shot at an ad the way deleting the in-page block did -- no relocate/poll
   needed, just hide on sight.
   In the first two cases Google's own placeholder-collapse doesn't reliably
   fire once we've moved the node, so we poll it: if no real ad iframe shows
   up within ~2s, we force the reserved space to 0 ourselves, so an unfilled
   slot never leaves a blank gap. */
(function () {
    function isMobile() {
        return window.matchMedia('(max-width: 768px)').matches;
    }
    function isBetween(before, after, el) {
        if (!before || !after) return false;
        return !!(before.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING) &&
               !!(after.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_PRECEDING);
    }
    function collapseIfUnfilled(node) {
        var attempts = 0;
        var poll = setInterval(function () {
            attempts++;
            if (!node.isConnected) {
                clearInterval(poll);
                return;
            }
            if (node.querySelector('iframe')) {
                clearInterval(poll);
                return;
            }
            if (attempts >= 10) {
                node.style.setProperty('display', 'none', 'important');
                clearInterval(poll);
            }
        }, 200);
    }
    function handleHeaderNavZone(node) {
        var header = document.getElementById('header');
        var nav = document.querySelector('.info-bar-container');
        if (!isBetween(header, nav, node)) return false;
        if (isMobile()) {
            node.style.setProperty('display', 'none', 'important');
            return true;
        }
        var target = document.querySelector('.outer-page-content');
        if (target) {
            target.before(node);
        } else if (nav) {
            nav.after(node);
        }
        collapseIfUnfilled(node);
        return true;
    }
    function handleCommentsZone(node) {
        var button = document.getElementById('comments-button');
        var box = document.getElementById('comments-box');
        if (!isBetween(button, box, node)) return false;
        box.after(node);
        collapseIfUnfilled(node);
        return true;
    }
    function inAnnotationGuardedZone(el) {
        return !!(el.closest('#header') || el.closest('#footer') || el.closest('.side-bar'));
    }
    function handleAnnotationChip(node) {
        if (node.classList && node.classList.contains('google-anno-sc') && inAnnotationGuardedZone(node)) {
            node.style.setProperty('display', 'none', 'important');
            return true;
        }
        return false;
    }
    function handle(node) {
        if (node.nodeType !== 1) return;
        if (node.classList && node.classList.contains('google-auto-placed')) {
            if (handleHeaderNavZone(node)) return;
            handleCommentsZone(node);
            return;
        }
        if (handleAnnotationChip(node)) return;
        if (node.querySelectorAll) {
            node.querySelectorAll('.google-auto-placed').forEach(function (n) {
                if (handleHeaderNavZone(n)) return;
                handleCommentsZone(n);
            });
            node.querySelectorAll('.google-anno-sc').forEach(function (n) {
                handleAnnotationChip(n);
            });
        }
    }
    new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
            m.addedNodes.forEach(handle);
        });
    }).observe(document.documentElement, {childList: true, subtree: true});
})();
</script>

    <section class="stats-section">

            <tr><th>Site</th><th class="views">Views</th></tr>
          </thead>

  <script>
    // Dark/Light theme toggle – saved in browser (no POST, no resubmit popup)
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;

    function setTheme(isDark) {
      if (isDark) {
        body.classList.add('dark');
        body.classList.remove('light');
        themeToggle.textContent = 'Switch to Light Mode';
        localStorage.setItem('theme', 'dark');
      } else {
        body.classList.add('light');
        body.classList.remove('dark');
        themeToggle.textContent = 'Switch to Dark Mode';
        localStorage.setItem('theme', 'light');
      }
    }

    const saved = localStorage.getItem('theme');
    if (saved === 'light') {
      setTheme(false);
    } else {
      setTheme(true);
    }

    themeToggle.addEventListener('click', () => {
      const isDarkNow = body.classList.contains('dark');
      setTheme(!isDarkNow);
    });
  </script>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const RANGE_LABELS = { '24h': '24 hours', '7d': '7 days', '30d': '30 days', '365d': '365 days', all: 'all time' };
    let currentRange = localStorage.getItem('statsRange') || '7d';
    if (!(currentRange in RANGE_LABELS)) currentRange = '7d';

    // The API already returns up to 50 rows in one (server-cached) call, so
    // expanding/collapsing the list below is pure client-side rendering --
    // no extra request or API cost per click.
    const PAGES_PREVIEW_COUNT = 10;
    let topPagesData = [];
    let showAllPages = false;
    const showMoreBtn = document.getElementById('showMorePages');

    function setActiveTab() {
      document.querySelectorAll('.range-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.range === currentRange);
      });
    }

    function renderTopPages() {
      const topPagesBody = document.getElementById('topPagesBody');
      if (!topPagesData.length) {
        topPagesBody.innerHTML = '<tr><td colspan="3" class="empty-state">No data for the past ' + RANGE_LABELS[currentRange] + '.</td></tr>';
        showMoreBtn.style.display = 'none';
        return;
      }

      const visible = showAllPages ? topPagesData : topPagesData.slice(0, PAGES_PREVIEW_COUNT);
      topPagesBody.innerHTML = visible.map(function (p) {
        const url = 'https://' + p.site + p.path;
        return '<tr><td><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(p.path) + '</a></td><td class="site"><a href="https://' + escapeHtml(p.site) + '" target="_blank" rel="noopener">' + escapeHtml(p.site) + '</a></td><td class="views">' + p.views.toLocaleString() + '</td></tr>';
      }).join('');

      if (topPagesData.length > PAGES_PREVIEW_COUNT) {
        showMoreBtn.style.display = 'block';
        showMoreBtn.textContent = showAllPages ? 'Show top ' + PAGES_PREVIEW_COUNT : 'Show all (' + topPagesData.length + ')';
      } else {
        showMoreBtn.style.display = 'none';
      }
    }

    showMoreBtn.addEventListener('click', function () {
      showAllPages = !showAllPages;
      renderTopPages();
    });

    async function loadStats() {
      setActiveTab();
      const siteTotalsBody = document.getElementById('siteTotalsBody');
      document.getElementById('topPagesBody').innerHTML = '<tr><td colspan="3" class="empty-state">Loading&hellip;</td></tr>';
      showMoreBtn.style.display = 'none';
      siteTotalsBody.innerHTML = '<tr><td colspan="2" class="empty-state">Loading&hellip;</td></tr>';
      document.getElementById('updatedAt').textContent = 'Loading stats…';

      try {
        const res = await fetch('/api/stats?range=' + encodeURIComponent(currentRange));
        if (!res.ok) throw new Error('bad response');
        const data = await res.json();

        topPagesData = data.topPages || [];
        showAllPages = false;
        renderTopPages();

        if (data.siteTotals && data.siteTotals.length) {
          siteTotalsBody.innerHTML = data.siteTotals.map(function (s) {
            return '<tr><td><a href="https://' + escapeHtml(s.site) + '" target="_blank" rel="noopener">' + escapeHtml(s.site) + '</a></td><td class="views">' + s.views.toLocaleString() + '</td></tr>';
          }).join('');
        } else {
          siteTotalsBody.innerHTML = '<tr><td colspan="2" class="empty-state">No data for the past ' + RANGE_LABELS[currentRange] + '.</td></tr>';
        }

        document.getElementById('updatedAt').textContent = 'Last updated: ' + new Date(data.updatedAt).toLocaleString();
      } catch (e) {
        document.getElementById('updatedAt').textContent = 'Stats are temporarily unavailable.';
      }
    }

    document.getElementById('rangeTabs').addEventListener('click', function (e) {
      const btn = e.target.closest('.range-tab');
      if (!btn || btn.dataset.range === currentRange) return;
      currentRange = btn.dataset.range;
      localStorage.setItem('statsRange', currentRange);
      loadStats();
    });

    loadStats();
  </script>

  <script>
    // ad-slot-fill-and-collapse: same approach as mes.fm/links -- request a fill for each manual

    (function () {
      document.querySelectorAll('.ad-slot ins.adsbygoogle').forEach(function () {

      document.querySelectorAll('.ad-slot').forEach(function (slot) {
        var attempts = 0;
        var poll = setInterval(function () {

            return;
          }
          if (attempts >= 10) {
            slot.style.setProperty('display', 'none', 'important');
            clearInterval(poll);
          }
        }, 200);
      });
    })();
